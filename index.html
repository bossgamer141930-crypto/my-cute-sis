<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Heart Firework</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02051c;
}

body{
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

.message{
    position:fixed;
    left:0;
    top:0;
    transform:translate(-50%,-50%);
    text-align:center;
    pointer-events:none;
    z-index:5;
    opacity:0;
    white-space:nowrap;
}

/* ======================================
   GLOWING WHITE MESSAGE
====================================== */

.message .main{
    font-family:Arial,sans-serif;
    font-size:clamp(20px,6vw,42px);
    font-weight:900;

    color:#ffffff;

    text-shadow:
        0 0 5px #ffffff,
        0 0 12px #ffffff,
        0 0 25px #ffffff,
        0 0 45px #ffffff,
        0 0 70px rgba(255,255,255,.9);
}

.message .sub{
    margin-top:5px;
    font-family:Arial,sans-serif;
    font-size:clamp(12px,3.5vw,20px);
    font-weight:700;

    color:#ffffff;

    text-shadow:
        0 0 5px #ffffff,
        0 0 12px #ffffff,
        0 0 25px #ffffff,
        0 0 40px rgba(255,255,255,.9);
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="message" id="message">
    <div class="main"></div>
    <div class="sub"></div>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const messageBox = document.getElementById("message");
const mainText = messageBox.querySelector(".main");
const subText = messageBox.querySelector(".sub");

let W = innerWidth;
let H = innerHeight;
let dpr = Math.min(devicePixelRatio || 1,2);

function resize(){

    W = innerWidth;
    H = innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
resize();

function random(min,max){
    return Math.random()*(max-min)+min;
}


// ======================================
// MESSAGES
// ======================================

const messages = [

    ["My Cute Sister","You are truly special ✨"],
    ["Thinking of You","Keep smiling always 😊"],
    ["Always With You","No matter what 💙"],
    ["You're Special","Never forget that ✨"],
    ["Lots of Love ❤️","Stay happy forever"],
    ["I Miss You","Take care always 💙"],
    ["You're Precious","Always keep smiling ✨"]

];

let messageIndex = 0;


// ======================================
// BACKGROUND PARTICLES
// ======================================

const bgParticles = [];
const risingParticles = [];

for(let i=650;i--;){

    bgParticles.push({

        x:Math.random()*W,
        y:Math.random()*H,

        size:random(.4,2.2),

        speed:random(.45,1.7),

        drift:random(-.35,.35),

        alpha:random(.25,.9),

        twinkle:Math.random()*Math.PI*2

    });

}

for(let i=190;i--;){

    risingParticles.push({

        x:Math.random()*W,
        y:Math.random()*H,

        size:random(.5,2),

        speed:random(1.2,3.8),

        alpha:random(.2,.8),

        trail:random(8,24)

    });

}


// ======================================
// FIREWORK PARTICLES
// ======================================

let fireworkParticles = [];


// ======================================
// HEART
// ======================================

function heartPoint(t,scale){

    return {

        x:16 * Math.pow(Math.sin(t),3) * scale,

        y:-(
            13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t)
        ) * scale

    };

}


// ======================================
// CREATE HEART
// ======================================

function createFireworkHeart(x,y){

    const scale = Math.min(W,H) * 0.021;

    /*
        Heart particles BLUE / CYAN
    */
    const heartHue = random(190,205);


    // ==================================
    // MAIN HEART
    // ==================================

    const heartCount = 1050;

    for(let i=0;i<heartCount;i++){

        const t = (i/heartCount)*Math.PI*2;

        const p = heartPoint(t,scale);

        const angle = Math.atan2(p.y,p.x);

        const speed = random(7,12);

        fireworkParticles.push({

            x:x,
            y:y,

            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,

            heartX:x+p.x,
            heartY:y+p.y,

            angle:angle,

            age:0,

            life:random(150,230),

            phase:0,

            phaseTime:random(16,24),

            friction:.994,

            gravity:random(.015,.045),

            size:random(1.1,2.7),

            alpha:1,

            trail:[],

            hue:heartHue,

            persistent:true

        });

    }


    // ==================================
    // OUTER HEART SPARKS
    // ==================================

    for(let i=380;i--;){

        const t = Math.random()*Math.PI*2;

        const p = heartPoint(
            t,
            scale*random(.92,1.08)
        );

        const angle = Math.atan2(p.y,p.x);

        const speed = random(9,14);

        fireworkParticles.push({

            x:x+p.x*.12,
            y:y+p.y*.12,

            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,

            heartX:x+p.x,
            heartY:y+p.y,

            angle:angle,

            age:0,

            life:random(130,200),

            phase:0,

            phaseTime:random(13,20),

            friction:.993,

            gravity:random(.02,.06),

            size:random(1,2.5),

            alpha:1,

            trail:[],

            hue:heartHue,

            persistent:true

        });

    }


    // ==================================
    // CENTER BURST
    // ==================================

    for(let i=260;i--;){

        const angle = Math.random()*Math.PI*2;

        const speed = random(6,12);

        fireworkParticles.push({

            x:x,
            y:y,

            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,

            age:0,

            life:random(45,90),

            phase:2,

            friction:.985,

            gravity:random(.025,.09),

            size:random(.7,2.1),

            alpha:1,

            trail:[],

            hue:heartHue,

            persistent:false

        });

    }


    // ==================================
    // MESSAGE
    // ==================================

    const msg = messages[messageIndex];

    mainText.textContent = msg[0];
    subText.textContent = msg[1];


    // ==================================
    // PURE GLOWING WHITE TEXT
    // ==================================

    mainText.style.color = "#ffffff";
    subText.style.color = "#ffffff";

    mainText.style.textShadow = `
        0 0 5px #ffffff,
        0 0 12px #ffffff,
        0 0 25px #ffffff,
        0 0 45px #ffffff,
        0 0 70px rgba(255,255,255,.9)
    `;

    subText.style.textShadow = `
        0 0 5px #ffffff,
        0 0 12px #ffffff,
        0 0 25px #ffffff,
        0 0 40px rgba(255,255,255,.9)
    `;


    messageBox.style.left = x+"px";
    messageBox.style.top = y+"px";

    messageBox.style.opacity = "1";


    messageIndex++;

    if(messageIndex >= messages.length){
        messageIndex = 0;
    }

}


// ======================================
// BACKGROUND
// ======================================

function drawBackground(){

    const gradient = ctx.createLinearGradient(
        0,0,
        0,H
    );

    gradient.addColorStop(0,"#010319");
    gradient.addColorStop(.5,"#03072b");
    gradient.addColorStop(1,"#00020f");

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,W,H);


    for(const p of bgParticles){

        p.y -= p.speed;
        p.x += p.drift;

        p.twinkle += .035;

        if(p.y < -5){

            p.y = H+5;
            p.x = Math.random()*W;

        }

        if(p.x < -5) p.x = W+5;
        if(p.x > W+5) p.x = -5;


        const alpha =
            p.alpha *
            (.65+Math.sin(p.twinkle)*.35);


        ctx.fillStyle =
            `rgba(130,190,255,${alpha})`;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


// ======================================
// RISING PARTICLES
// ======================================

function drawRisingParticles(){

    for(const p of risingParticles){

        p.y -= p.speed;

        if(p.y < -20){

            p.y = H+20;
            p.x = Math.random()*W;

        }


        ctx.strokeStyle =
            `rgba(70,180,255,${p.alpha*.35})`;

        ctx.lineWidth = p.size;

        ctx.beginPath();

        ctx.moveTo(
            p.x,
            p.y+p.trail
        );

        ctx.lineTo(
            p.x,
            p.y
        );

        ctx.stroke();


        ctx.fillStyle =
            `rgba(150,220,255,${p.alpha})`;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


// ======================================
// FIREWORK DRAW
// ======================================

function drawFirework(){

    for(let i=fireworkParticles.length-1;i>=0;i--){

        const p = fireworkParticles[i];

        p.age++;


        // ==================================
        // HEART FORMATION
        // ==================================

        if(p.phase===0){

            const dx = p.heartX-p.x;
            const dy = p.heartY-p.y;

            const dist = Math.sqrt(dx*dx+dy*dy);

            if(dist>5){

                p.vx += (dx/dist)*1.35;
                p.vy += (dy/dist)*1.35;

            }

            p.x += p.vx;
            p.y += p.vy;


            if(p.age>p.phaseTime){

                p.phase=1;

                const boost = random(1.05,1.3);

                p.vx =
                    Math.cos(p.angle) *
                    random(8,14) *
                    boost;

                p.vy =
                    Math.sin(p.angle) *
                    random(8,14) *
                    boost;

            }

        }


        // ==================================
        // OUTWARD EXPLOSION
        // ==================================

        else if(p.phase===1){

            p.vx *= p.friction;
            p.vy *= p.friction;

            p.vy += p.gravity;

            p.x += p.vx;
            p.y += p.vy;

        }


        // ==================================
        // CENTER BURST
        // ==================================

        else{

            p.vx *= p.friction;
            p.vy *= p.friction;

            p.vy += p.gravity;

            p.x += p.vx;
            p.y += p.vy;

        }


        // ==================================
        // TRAIL
        // ==================================

        p.trail.push({
            x:p.x,
            y:p.y
        });

        if(p.trail.length>13){
            p.trail.shift();
        }


        p.alpha =
            Math.max(
                0,
                1-p.age/p.life
            );


        // ==================================
        // TRAIL DRAW
        // ==================================

        if(p.trail.length>1){

            ctx.beginPath();

            ctx.moveTo(
                p.trail[0].x,
                p.trail[0].y
            );

            for(let j=1;j<p.trail.length;j++){

                ctx.lineTo(
                    p.trail[j].x,
                    p.trail[j].y
                );

            }

            ctx.strokeStyle =
                `hsla(
                    ${p.hue},
                    100%,
                    65%,
                    ${p.alpha*.35}
                )`;

            ctx.lineWidth =
                Math.max(.5,p.size*.75);

            ctx.stroke();

        }


        // ==================================
        // BLUE/CYAN PARTICLE
        // ==================================

        ctx.shadowBlur = 16;

        ctx.shadowColor =
            `hsl(${p.hue},100%,65%)`;

        ctx.fillStyle =
            `hsla(
                ${p.hue},
                100%,
                72%,
                ${p.alpha}
            )`;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur = 0;


        if(p.age>p.life){

            fireworkParticles.splice(i,1);

        }

    }

}


// ======================================
// ANIMATION
// ======================================

function animate(){

    drawBackground();

    drawRisingParticles();

    drawFirework();

    requestAnimationFrame(animate);

}

animate();


// ======================================
// TOUCH
// ======================================

canvas.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        createFireworkHeart(
            e.clientX,
            e.clientY
        );

    },
    {passive:false}
);


document.addEventListener(
    "touchmove",
    function(e){

        e.preventDefault();

    },
    {passive:false}
);

</script>

</body>
</html>
